name: CI

on:
  push:
    branches: [master]
  pull_request:

# Cancel in-flight runs when a new push happens on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ---------------------------------------------------------------------------
  # Rust workspace: fmt, clippy, test. Uses native Rust (fast via Swatinem cache)
  # rather than Docker to keep CI under a minute on warm cache.
  # ---------------------------------------------------------------------------
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
          target: wasm32-unknown-unknown

      # setup-rust-toolchain sets RUSTFLAGS=-D warnings by default which turns
      # any warning into a CI failure. We don't want that — clippy/warnings are
      # useful feedback but shouldn't block merging. Clear it for every step.
      - name: cargo fmt --check
        env:
          RUSTFLAGS: ""
        run: cargo fmt --all -- --check

      - name: cargo clippy
        env:
          RUSTFLAGS: ""
        run: cargo clippy --workspace --locked --all-targets

      - name: cargo test
        env:
          RUSTFLAGS: ""
          CC: clang
        run: cargo test --workspace --locked

      - name: cargo test wasm feature
        env:
          RUSTFLAGS: ""
          CC: clang
        run: cargo test -p sync-core --features wasm --locked

      - name: cargo check wasm
        env:
          RUSTFLAGS: ""
        run: cargo check -p sync-core --target wasm32-unknown-unknown --features wasm --no-default-features --locked

  # ---------------------------------------------------------------------------
  # Plugin: type-check the TypeScript source and run the Node-compatible
  # regression suite without waiting for generated WASM artifacts.
  # ---------------------------------------------------------------------------
  plugin:
    name: Plugin (tsc + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugin
    steps:
      - uses: actions/checkout@v4

      # Repo-root manifest.json (read by the Obsidian community-plugin bot) must
      # stay byte-identical to plugin/manifest.json (used by local/dev installs).
      - name: manifest.json root == plugin copy
        working-directory: ${{ github.workspace }}
        run: |
          cmp -s manifest.json plugin/manifest.json \
            || { echo "::error::manifest.json and plugin/manifest.json differ — keep them in sync"; exit 1; }

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: plugin/package-lock.json

      - run: npm ci --no-audit --no-fund

      - run: npx tsc --noEmit

      - run: npm test

  # ---------------------------------------------------------------------------
  # Plugin/WASM: exercise the real browser worker and production bundle with
  # freshly built scalar/SIMD artifacts. Keep this separate from the fast source
  # tests above; neither gate replaces the other. No artifacts are published.
  # ---------------------------------------------------------------------------
  plugin-wasm:
    name: Plugin (WASM parity + browser worker + bundle)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.95.0
          target: wasm32-unknown-unknown

      # Match the release toolchain and both-variant build path.
      - name: Install WASM tools
        run: |
          curl -sSfL https://github.com/WebAssembly/binaryen/releases/download/version_117/binaryen-version_117-x86_64-linux.tar.gz \
            -o /tmp/binaryen-version_117-x86_64-linux.tar.gz
          echo "3dc677006555b355ea2da5e82602065a161d5e83eaefd3f759afa00b96e83212  /tmp/binaryen-version_117-x86_64-linux.tar.gz" \
            | sha256sum -c -
          sudo tar -xz -C /usr/local/bin --strip-components=2 \
            -f /tmp/binaryen-version_117-x86_64-linux.tar.gz \
            binaryen-version_117/bin/wasm-opt
          curl -sSfL https://github.com/rustwasm/wasm-pack/releases/download/v0.13.1/wasm-pack-v0.13.1-x86_64-unknown-linux-musl.tar.gz \
            -o /tmp/wasm-pack-v0.13.1-x86_64-unknown-linux-musl.tar.gz
          echo "c539d91ccab2591a7e975bcf82c82e1911b03335c80aa83d67ad25ed2ad06539  /tmp/wasm-pack-v0.13.1-x86_64-unknown-linux-musl.tar.gz" \
            | sha256sum -c -
          sudo tar -xz -C /usr/local/bin --strip-components=1 \
            -f /tmp/wasm-pack-v0.13.1-x86_64-unknown-linux-musl.tar.gz \
            wasm-pack-v0.13.1-x86_64-unknown-linux-musl/wasm-pack

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: plugin/package-lock.json

      - name: Build scalar/SIMD WASM
        env:
          RUSTFLAGS: ""
        run: bash scripts/build-wasm.sh plugin/wasm

      - name: Verify scalar/SIMD parity
        run: node scripts/verify-wasm-parity.mjs plugin/wasm

      - name: Verify WASM allocation lifetime and 25k rebuilds
        run: node scripts/verify-wasm-memory.mjs plugin/wasm

      - name: Install plugin dependencies
        working-directory: plugin
        run: npm ci --no-audit --no-fund

      - name: Verify native root mutation complexity
        working-directory: plugin
        run: npm run test:native-root-complexity

      - name: Test actual browser worker bundle
        working-directory: plugin
        run: npm run test:browser-probe

      - name: Test actual browser hash worker bundle
        working-directory: plugin
        run: npm run test:browser-hash-worker

      - name: Build production plugin bundle
        working-directory: plugin
        run: npm run build

      - name: Stage fresh WASM for native integration gates
        uses: actions/upload-artifact@v4
        with:
          name: ci-plugin-wasm
          retention-days: 1
          path: |
            plugin/wasm/sync_core.js
            plugin/wasm/sync_core_bg.wasm
            plugin/wasm/sync_core_simd.js
            plugin/wasm/sync_core_simd_bg.wasm
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Docker: verify the multi-stage Dockerfile still builds end-to-end.
  # Uses gha cache so warm runs are fast.
  # ---------------------------------------------------------------------------
  docker:
    name: Docker (server image)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: .
          target: server
          load: true
          push: false
          tags: obsetync/server:ci
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      - name: Extract exact release server binary
        run: |
          mkdir -p ci-server
          container_id="$(docker create obsetync/server:ci)"
          trap 'docker rm -f "$container_id" >/dev/null' EXIT
          docker cp "$container_id:/usr/local/bin/sync-server" ci-server/sync-server
          chmod 0755 ci-server/sync-server

      - name: Stage release server for native integration gates
        uses: actions/upload-artifact@v4
        with:
          name: ci-server-binary
          retention-days: 1
          path: ci-server/sync-server
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Native integration: use the exact release-profile server extracted from
  # the CI image and the freshly packaged WASM. These listener/crash tests stay
  # opt-in from source-only npm test, but must gate mergeable checkpoints.
  # ---------------------------------------------------------------------------
  native-integration:
    name: Native integration (WS data + crash recovery)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [docker, plugin-wasm]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: plugin/package-lock.json

      - name: Restore exact release server binary
        uses: actions/download-artifact@v4
        with:
          name: ci-server-binary
          path: target/release

      - name: Restore fresh packaged WASM
        uses: actions/download-artifact@v4
        with:
          name: ci-plugin-wasm
          path: plugin/wasm

      - name: Install plugin dependencies
        working-directory: plugin
        run: npm ci --no-audit --no-fund

      - name: Verify native WS data lane
        working-directory: plugin
        env:
          NODE_OPTIONS: --experimental-websocket
        run: |
          chmod 0755 "$GITHUB_WORKSPACE/target/release/sync-server"
          npm run test:native-ws-data -- --binary "$GITHUB_WORKSPACE/target/release/sync-server"

      - name: Verify crash recovery before root commit
        working-directory: plugin
        run: npm run test:native-root-crash -- --case objects-before-root --binary "$GITHUB_WORKSPACE/target/release/sync-server"

      - name: Verify crash recovery after accepted root
        working-directory: plugin
        run: npm run test:native-root-crash -- --case root-accepted-before-response --binary "$GITHUB_WORKSPACE/target/release/sync-server"

  # ---------------------------------------------------------------------------
  # E2E: spin up the isolated docker-compose stack and run the e2e suite
  # against it. Reuses the gha buildx cache the `docker` job populated, so
  # warm runs build the image in seconds.
  #
  # Coverage: enrollment lifecycle, single-device push/pull, two-device sync,
  # the full conflict-resolution truth table, and AEAD transport security.
  # See docs/conflict-resolution.md.
  # ---------------------------------------------------------------------------
  e2e:
    name: E2E (compose stack + conflict suite)
    runs-on: ubuntu-latest
    needs: docker  # depend on docker job so the gha cache is warm
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.95.0

      - uses: docker/setup-buildx-action@v3

      # Build the server image with the same gha cache the `docker` job uses.
      # `load: true` puts it into the runner's docker daemon under the
      # tag the e2e compose file expects (`obsetync/server:local`). Cache
      # hit from the previous `docker` job → near-instant restore.
      - name: Build server image (load into docker)
        uses: docker/build-push-action@v5
        with:
          context: .
          target: server
          load: true
          tags: obsetync/server:local
          cache-from: type=gha

      - name: Bring up e2e stack
        run: docker compose -f docker-compose.e2e.yml up -d

      - name: Wait for /health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:27282/health >/dev/null 2>&1; then
              echo "ready"; exit 0
            fi
            sleep 1
          done
          echo "::error::server failed to become healthy in 60s"
          docker compose -f docker-compose.e2e.yml logs --tail=120 e2e-server
          exit 1

      - name: Run E2E suite
        env:
          RUSTFLAGS: ""
          CC: clang
          # Tests serialize because they share a single server container's
          # state. They also use unique vault_ids so accumulating state
          # between tests doesn't leak.
        run: cargo test -p e2e-tests --features e2e --locked -- --test-threads=1

      - name: Dump server logs (on failure)
        if: failure()
        run: docker compose -f docker-compose.e2e.yml logs --tail=300 e2e-server

      - name: Tear down stack
        if: always()
        run: docker compose -f docker-compose.e2e.yml down -v --remove-orphans

  # ---------------------------------------------------------------------------
  # Nix: flake check (runs tests via crane) + build server derivation.
  # Proves the hermetic path stays green.
  # ---------------------------------------------------------------------------
  nix:
    name: Nix (flake check + build server)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            experimental-features = nix-command flakes

      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: nix flake check
        run: nix flake check --print-build-logs

      - name: nix build .#server
        run: nix build .#server --print-build-logs
